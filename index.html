<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pip — study timer</title>
<meta name="description" content="A cutesy study timer with a little pixel creature who works alongside you.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffeedc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241d2e" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-status="idle" data-mode="focus">

<div class="sky" aria-hidden="true"></div>

<main class="stage">

  <section class="card clock-card" data-perch>
    <button class="clock" id="clock" type="button" title="Switch 12 / 24 hour">
      <span id="clockTime">--:--</span><span class="secs" id="clockSecs">00</span><span class="mer" id="meridiem"></span>
    </button>
    <p class="clock-meta">
      <span id="dateLabel">&nbsp;</span>
      <span class="dot" aria-hidden="true">•</span>
      <span id="zoneLabel">&nbsp;</span>
    </p>
  </section>

  <section class="card timer-card" data-perch>
    <input class="task" id="task" type="text" maxlength="42" spellcheck="false"
           placeholder="what are we working on?" aria-label="What are you working on?">

    <div class="dial">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="88"></circle>
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="88"></circle>
      </svg>
      <div class="dial-face">
        <button class="countdown" id="countdown" type="button" title="Click to set the length">30:00</button>
        <input class="countdown-input" id="durationInput" type="text" spellcheck="false" hidden
               aria-label="Timer length, for example 25, 50:00 or 1h30">
        <p class="phase" id="phase" role="status" aria-live="polite">ready</p>
      </div>
    </div>

    <div class="presets" id="presets" role="group" aria-label="Session lengths in minutes">
      <button type="button" data-min="15">15</button>
      <button type="button" data-min="30">30</button>
      <button type="button" data-min="45">45</button>
      <button type="button" data-min="60">60</button>
      <button type="button" data-min="90">90</button>
      <button type="button" data-min="120">120</button>
    </div>

    <div class="controls">
      <button class="nudge" id="minus" type="button" aria-label="Five minutes less">−5</button>
      <button class="go" id="startPause" type="button">start</button>
      <button class="nudge" id="plus" type="button" aria-label="Five minutes more">+5</button>
    </div>

    <button class="ghost reset is-gone" id="reset" type="button" tabindex="-1" aria-hidden="true">reset</button>
  </section>

  <div class="row">
    <section class="card today-card" data-perch aria-label="Today">
      <h2 class="card-title">today</h2>
      <div class="pips" id="pips" aria-hidden="true"></div>
      <p class="today-line" id="stats">no sessions yet</p>
    </section>

    <section class="card alarm-card" data-perch aria-label="Alarms">
      <h2 class="card-title">alarms</h2>
      <ul class="alarm-list" id="alarmList"></ul>
      <button class="alarm-add" id="alarmAdd" type="button">+ alarm</button>
      <input class="alarm-input" id="alarmInput" type="text" spellcheck="false" hidden
             placeholder="16:30" aria-label="Alarm time, for example 16:30, 4:30pm, or 45m from now">
    </section>
  </div>

  <p class="hint" aria-hidden="true">space start · r reset · a alarm · p hide pip · f fullscreen</p>

</main>

<canvas id="petCanvas" aria-hidden="true"></canvas>
<div id="petHit" aria-hidden="true" title="say hi to pip"></div>
<div id="petBubble" class="bubble" aria-live="polite"></div>

<div class="tools">
  <button id="soundBtn" type="button" class="tool" aria-pressed="true" title="Sound on / off">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path class="wave" d="M16 9.2a4 4 0 0 1 0 5.6"></path><path class="wave" d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"></path><path class="mute" d="M16.5 9.8l5 4.4M21.5 9.8l-5 4.4"></path></svg>
    <span class="sr">Sound</span>
  </button>
  <button id="notifyBtn" type="button" class="tool" aria-pressed="false" title="Notify me when time is up">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 14 6 10z"></path><path d="M10.2 18.5a2 2 0 0 0 3.6 0"></path></svg>
    <span class="sr">Notify</span>
  </button>
  <button id="petBtn" type="button" class="tool" aria-pressed="true" title="Hide / show pip">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15.5c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5v3H5z"></path><path d="M9 13.5h.01M15 13.5h.01" stroke-width="2.2"></path><path d="M8 18.5v2M12 18.5v2M16 18.5v2"></path></svg>
    <span class="sr">Pip</span>
  </button>
  <button id="themeBtn" type="button" class="tool" title="Day / night">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4 8.2 8.2 0 1 0 20 14.5z"></path><g class="sun"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path></g></svg>
    <span class="sr">Theme</span>
  </button>
  <button id="fullBtn" type="button" class="tool" title="Fullscreen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
    <span class="sr">Fullscreen</span>
  </button>
</div>

<script src="assets/pet.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
