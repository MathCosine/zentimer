<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pip — study desk</title>
<meta name="description" content="A study timer, day planner and task list with two little pixel creatures.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eaf4fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#152530" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preload" href="../assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/style.css">
<script>
  /* the text size you chose, before anything is drawn in the wrong one */
  (function () {
    var size = 'large';
    try { size = (JSON.parse(localStorage.getItem('pip.state.v1') || '{}').settings || {}).textSize || size; } catch (e) {}
    var sizes = {
      normal: '100%',
      large: 'clamp(100%, calc(100% + (100vw - 320px) * 0.036), 112.5%)',
      larger: 'clamp(100%, calc(100% + (100vw - 320px) * 0.073), 125%)'
    };
    document.documentElement.style.fontSize = sizes[size] || sizes.large;
  })();
</script>
</head>
<body data-status="idle" data-mode="focus">

<div class="sky" aria-hidden="true"></div>

<main class="app">

  <header class="top">
    <div class="top-clock">
      <button class="clock" id="clock" type="button" title="Switch 12 / 24 hour">
        <span id="clockTime">--:--</span><span class="secs" id="clockSecs">00</span><span class="mer" id="meridiem"></span>
      </button>
      <p class="clock-meta">
        <span id="dateLabel">&nbsp;</span>
        <span class="dot" aria-hidden="true">·</span>
        <span id="zoneLabel">&nbsp;</span>
      </p>
    </div>
    <div class="tools">
      <button id="alarmBtn" type="button" class="tool" aria-expanded="false" title="Alarms">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"></circle><path d="M12 9.5V13l2.2 1.6M4.5 5.5l2.5-2M19.5 5.5l-2.5-2"></path></svg>
        <span class="tool-note" id="alarmNote" hidden></span>
        <span class="sr">Alarms</span>
      </button>
      <button id="menuBtn" type="button" class="tool" aria-expanded="false" title="Settings and your account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.8l1.6 2.3 2.7-.6.6 2.7 2.3 1.6-1.2 2.5 1.2 2.5-2.3 1.6-.6 2.7-2.7-.6L12 21.2l-1.6-2.3-2.7.6-.6-2.7-2.3-1.6 1.2-2.5-1.2-2.5 2.3-1.6.6-2.7 2.7.6z"></path></svg>
        <span class="tool-dot" id="syncDot" aria-hidden="true"></span>
        <span class="sr">Settings</span>
      </button>
    </div>
  </header>

  <section class="card bar" aria-label="Timer">
    <div class="bar-timer">
      <div class="dial">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="88"></circle>
          <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="88"></circle>
        </svg>
        <div class="dial-face">
          <button class="countdown" id="countdown" type="button" title="Click to set the length">30:00</button>
          <input class="countdown-input" id="durationInput" type="text" spellcheck="false" hidden
                 aria-label="Timer length, for example 25, 50:00 or 1h30">
        </div>
      </div>

      <div class="timer-side">
        <p class="phase" id="phase" role="status" aria-live="polite">ready</p>
        <p class="timer-doing" id="timerDoing"></p>
        <p class="today-line" id="stats">no sessions yet</p>
        <div class="pips" id="pips" aria-hidden="true"></div>
      </div>

      <div class="controls">
        <button class="go" id="startPause" type="button">start</button>
        <button class="ghost reset is-gone" id="reset" type="button" tabindex="-1" aria-hidden="true">reset</button>
      </div>
    </div>

    <div class="timer-lengths">
      <button class="nudge" id="minus" type="button" aria-label="Five minutes less">−5</button>
      <div class="presets" id="presets" role="group" aria-label="Session lengths in minutes"></div>
      <button class="nudge" id="plus" type="button" aria-label="Five minutes more">+5</button>
    </div>
  </section>

<section class="card plan-card" aria-label="Today's plan">
    <div class="now-strip" id="nowStrip">
      <span class="now-dot" aria-hidden="true"></span>
      <div class="now-text">
        <strong id="nowTitle">nothing planned</strong>
        <span id="nowWhen"></span>
      </div>
      <button class="now-shift" id="nowShift" type="button" hidden></button>
    </div>
    <div class="aim" id="aim" hidden></div>
    <div class="queue" id="queue" hidden></div>
    <div class="plan-head">
      <button class="day-step" id="dayPrev" type="button" aria-label="Day before">‹</button>
      <button class="day-label" id="dayLabel" type="button" title="Back to today">today</button>
      <button class="day-step" id="dayNext" type="button" aria-label="Day after">›</button>
      <span class="day-sum" id="daySum"></span>
      <button class="now-times" id="timesBtn" type="button" aria-pressed="false" title="Show the hours">hours ▾</button>
      <button class="pin has-label" id="weekBtn" type="button" aria-pressed="false" title="The week ahead: how much each day holds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
        week
      </button>
      <button class="pin" id="pinBtn" type="button" aria-pressed="false" title="Open the whole day">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
      </button>
    </div>
    <div class="timeline-wrap" id="timelineWrap">
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="wk-ahead" id="weekAhead" hidden></div>
    <div class="week-wrap" id="weekWrap" hidden>
      <div class="week" id="week"></div>
    </div>
    <div class="block-bar" id="blockBar" hidden></div>
  </section>

  <section class="card tasks-card" aria-label="Tasks">
    <div class="task-head">
      <div class="views" id="views" role="group" aria-label="Lists"></div>
    </div>
    <div class="find-row" id="findRow">
      <label class="find-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15l5 5"></path></svg>
        <input id="findInput" type="search" autocomplete="off" placeholder="find a task…" aria-label="Find a task">
        <button id="findClear" type="button" aria-label="Stop looking" hidden>✕</button>
      </label>
      <button id="tagsBtn" type="button" class="icon-btn" aria-pressed="false" title="Every tag at once">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>
        <span class="sr">tags</span>
      </button>
      <button id="taskMore" type="button" class="icon-btn" aria-expanded="false" title="Sort, split, paste and more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="17" r="2"></circle></svg>
        <span class="sr">more</span>
      </button>
    </div>
    <div class="task-tools" id="taskTools" hidden>
      <button id="sortBtn" type="button" aria-pressed="false" title="What order the list comes in">sort</button>
      <button id="splitBtn" type="button" aria-pressed="false" title="Two panes, split by tag">split</button>
      <button id="doneBtn" type="button" aria-pressed="false" title="Show finished">done</button>
      <button id="bulkBtn" type="button" title="Paste many tasks">paste</button>
      <button id="listBtn" type="button" title="New list">+ list</button>
    </div>
    <div class="sort-row" id="sortRow" hidden>
      <span class="chip-label">order by</span>
      <span class="pick-row" id="sortPicks"></span>
      <button id="sortDir" type="button" class="sort-dir" aria-pressed="false"></button>
    </div>
    <div class="chips" id="tagChips" hidden></div>
    <div class="add-panel" id="addPanel" hidden></div>
    <form class="task-add" id="taskAdd">
      <input id="taskInput" type="text" autocomplete="off" placeholder="add a task…  try: PHY essay tue 4pm 45m" aria-label="Add a task">
      <button type="button" id="addHelp" class="add-help" aria-pressed="false" aria-label="What it understands">?</button>
      <button type="button" id="aiAdd" class="ai-add" title="Let the AI read it: due dates, how long, what comes first" aria-label="Add with AI">✦</button>
      <button type="submit" aria-label="Add">+</button>
    </form>
    <div class="ai-cards" id="aiCards" hidden></div>
    <div class="add-sheet" id="addSheet" hidden></div>
    <p class="add-hint" id="addHint" aria-live="polite" hidden></p>
    <ul class="task-list" id="taskList"></ul>
    <div class="tag-grid" id="tagGrid" hidden></div>
    <p class="task-foot"><span id="taskCount">0 open</span></p>
  </section>

  <section class="card settings-card" id="settingsCard" aria-label="Settings" hidden>
    <div class="settings-head">
      <h2>settings</h2>
      <button class="settings-close" id="settingsClose" type="button">done</button>
    </div>
    <div class="settings-body" id="settingsBody"></div>
  </section>

</main>

<canvas id="petCanvas" aria-hidden="true"></canvas>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="menu-pop pop" id="menuPop" hidden>
  <section class="menu-acct" aria-label="Your account">
    <div class="acct-card">
      <span class="acct-face" id="authFace" aria-hidden="true"></span>
      <span class="acct-text">
        <b class="sync-who" id="authWho">your desk, everywhere</b>
        <span class="sync-status" id="syncStatus">this browser only</span>
      </span>
    </div>
    <div class="sync-row" id="authForm">
      <a class="go small" id="signInLink" href="../account/#signin">sign in</a>
      <a class="ghost small" id="makeLink" href="../account/#signup">make an account</a>
    </div>
    <div class="sync-row" id="authAccount" hidden>
      <a class="go small" id="acctLink" href="../account/">your account</a>
      <button id="authOut" type="button" class="ghost small">sign out</button>
    </div>
  </section>
  <button id="settingsBtn" type="button" class="menu-row" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7h9M19 7h1.5M3.5 12h5M15 12h5.5M3.5 17h11M21 17h-0.5"></path><circle cx="15" cy="7" r="2.3"></circle><circle cx="11" cy="12" r="2.3"></circle><circle cx="17.5" cy="17" r="2.3"></circle></svg>
    <span class="menu-label">settings<small>tags, calendar, bedtime</small></span>
  </button>
  <button id="soundBtn" type="button" class="menu-row" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path class="wave" d="M16 9.2a4 4 0 0 1 0 5.6"></path><path class="wave" d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"></path><path class="mute" d="M16.5 9.8l5 4.4M21.5 9.8l-5 4.4"></path></svg>
    <span class="menu-label">sound</span><span class="switch" aria-hidden="true"></span>
  </button>
  <button id="notifyBtn" type="button" class="menu-row" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 14 6 10z"></path><path d="M10.2 18.5a2 2 0 0 0 3.6 0"></path></svg>
    <span class="menu-label">notifications</span><span class="switch" aria-hidden="true"></span>
  </button>
  <button id="petBtn" type="button" class="menu-row" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15.5c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5v3H5z"></path><path d="M9 13.5h.01M15 13.5h.01" stroke-width="2.2"></path><path d="M8 18.5v2M12 18.5v2M16 18.5v2"></path></svg>
    <span class="menu-label">pets</span><span class="switch" aria-hidden="true"></span>
  </button>
  <button id="themeBtn" type="button" class="menu-row" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4 8.2 8.2 0 1 0 20 14.5z"></path><g class="sun"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path></g></svg>
    <span class="menu-label">night mode</span><span class="switch" aria-hidden="true"></span>
  </button>
  <button id="fullBtn" type="button" class="menu-row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
    <span class="menu-label">full screen</span>
  </button>
</div>

<div class="alarm-pop pop" id="alarmPop" hidden>
  <h3>alarms</h3>
  <ul class="alarm-list" id="alarmList"></ul>
  <button class="alarm-add" id="alarmAdd" type="button">+ alarm</button>
  <input class="alarm-input" id="alarmInput" type="text" spellcheck="false" hidden
         placeholder="16:30" aria-label="Alarm time, for example 16:30, 4:30pm, or 45m from now">
</div>

<div class="ring-overlay" id="ringOverlay" hidden>
  <div class="ring-card" role="alertdialog" aria-labelledby="ringHeading">
    <svg class="ring-clock" viewBox="0 0 11 12" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="1" height="1" fill="currentColor"/><rect x="8" y="0" width="1" height="1" fill="currentColor"/><rect x="1" y="1" width="1" height="1" fill="currentColor"/><rect x="2" y="1" width="1" height="1" fill="currentColor"/><rect x="3" y="1" width="1" height="1" fill="currentColor"/><rect x="7" y="1" width="1" height="1" fill="currentColor"/><rect x="8" y="1" width="1" height="1" fill="currentColor"/><rect x="9" y="1" width="1" height="1" fill="currentColor"/><rect x="2" y="2" width="1" height="1" fill="currentColor"/><rect x="3" y="2" width="1" height="1" fill="currentColor"/><rect x="4" y="2" width="1" height="1" fill="currentColor"/><rect x="5" y="2" width="1" height="1" fill="currentColor"/><rect x="6" y="2" width="1" height="1" fill="currentColor"/><rect x="7" y="2" width="1" height="1" fill="currentColor"/><rect x="8" y="2" width="1" height="1" fill="currentColor"/><rect x="1" y="3" width="1" height="1" fill="currentColor"/><rect x="2" y="3" width="1" height="1" fill="var(--card)"/><rect x="3" y="3" width="1" height="1" fill="var(--card)"/><rect x="4" y="3" width="1" height="1" fill="var(--card)"/><rect x="5" y="3" width="1" height="1" fill="var(--card)"/><rect x="6" y="3" width="1" height="1" fill="var(--card)"/><rect x="7" y="3" width="1" height="1" fill="var(--card)"/><rect x="8" y="3" width="1" height="1" fill="var(--card)"/><rect x="9" y="3" width="1" height="1" fill="currentColor"/><rect x="0" y="4" width="1" height="1" fill="currentColor"/><rect x="1" y="4" width="1" height="1" fill="var(--card)"/><rect x="2" y="4" width="1" height="1" fill="var(--card)"/><rect x="3" y="4" width="1" height="1" fill="var(--card)"/><rect x="4" y="4" width="1" height="1" fill="currentColor"/><rect x="5" y="4" width="1" height="1" fill="var(--card)"/><rect x="6" y="4" width="1" height="1" fill="var(--card)"/><rect x="7" y="4" width="1" height="1" fill="var(--card)"/><rect x="8" y="4" width="1" height="1" fill="var(--card)"/><rect x="9" y="4" width="1" height="1" fill="var(--card)"/><rect x="10" y="4" width="1" height="1" fill="currentColor"/><rect x="0" y="5" width="1" height="1" fill="currentColor"/><rect x="1" y="5" width="1" height="1" fill="var(--card)"/><rect x="2" y="5" width="1" height="1" fill="var(--card)"/><rect x="3" y="5" width="1" height="1" fill="var(--card)"/><rect x="4" y="5" width="1" height="1" fill="currentColor"/><rect x="5" y="5" width="1" height="1" fill="var(--card)"/><rect x="6" y="5" width="1" height="1" fill="var(--card)"/><rect x="7" y="5" width="1" height="1" fill="var(--card)"/><rect x="8" y="5" width="1" height="1" fill="var(--card)"/><rect x="9" y="5" width="1" height="1" fill="var(--card)"/><rect x="10" y="5" width="1" height="1" fill="currentColor"/><rect x="0" y="6" width="1" height="1" fill="currentColor"/><rect x="1" y="6" width="1" height="1" fill="var(--card)"/><rect x="2" y="6" width="1" height="1" fill="var(--card)"/><rect x="3" y="6" width="1" height="1" fill="var(--card)"/><rect x="4" y="6" width="1" height="1" fill="currentColor"/><rect x="5" y="6" width="1" height="1" fill="currentColor"/><rect x="6" y="6" width="1" height="1" fill="currentColor"/><rect x="7" y="6" width="1" height="1" fill="var(--card)"/><rect x="8" y="6" width="1" height="1" fill="var(--card)"/><rect x="9" y="6" width="1" height="1" fill="var(--card)"/><rect x="10" y="6" width="1" height="1" fill="currentColor"/><rect x="0" y="7" width="1" height="1" fill="currentColor"/><rect x="1" y="7" width="1" height="1" fill="var(--card)"/><rect x="2" y="7" width="1" height="1" fill="var(--card)"/><rect x="3" y="7" width="1" height="1" fill="var(--card)"/><rect x="4" y="7" width="1" height="1" fill="var(--card)"/><rect x="5" y="7" width="1" height="1" fill="var(--card)"/><rect x="6" y="7" width="1" height="1" fill="var(--card)"/><rect x="7" y="7" width="1" height="1" fill="var(--card)"/><rect x="8" y="7" width="1" height="1" fill="var(--card)"/><rect x="9" y="7" width="1" height="1" fill="var(--card)"/><rect x="10" y="7" width="1" height="1" fill="currentColor"/><rect x="0" y="8" width="1" height="1" fill="currentColor"/><rect x="1" y="8" width="1" height="1" fill="var(--card)"/><rect x="2" y="8" width="1" height="1" fill="var(--card)"/><rect x="3" y="8" width="1" height="1" fill="var(--card)"/><rect x="4" y="8" width="1" height="1" fill="var(--card)"/><rect x="5" y="8" width="1" height="1" fill="var(--card)"/><rect x="6" y="8" width="1" height="1" fill="var(--card)"/><rect x="7" y="8" width="1" height="1" fill="var(--card)"/><rect x="8" y="8" width="1" height="1" fill="var(--card)"/><rect x="9" y="8" width="1" height="1" fill="var(--card)"/><rect x="10" y="8" width="1" height="1" fill="currentColor"/><rect x="1" y="9" width="1" height="1" fill="currentColor"/><rect x="2" y="9" width="1" height="1" fill="var(--card)"/><rect x="3" y="9" width="1" height="1" fill="var(--card)"/><rect x="4" y="9" width="1" height="1" fill="var(--card)"/><rect x="5" y="9" width="1" height="1" fill="var(--card)"/><rect x="6" y="9" width="1" height="1" fill="var(--card)"/><rect x="7" y="9" width="1" height="1" fill="var(--card)"/><rect x="8" y="9" width="1" height="1" fill="var(--card)"/><rect x="9" y="9" width="1" height="1" fill="currentColor"/><rect x="2" y="10" width="1" height="1" fill="currentColor"/><rect x="3" y="10" width="1" height="1" fill="currentColor"/><rect x="4" y="10" width="1" height="1" fill="currentColor"/><rect x="5" y="10" width="1" height="1" fill="currentColor"/><rect x="6" y="10" width="1" height="1" fill="currentColor"/><rect x="7" y="10" width="1" height="1" fill="currentColor"/><rect x="8" y="10" width="1" height="1" fill="currentColor"/><rect x="1" y="11" width="1" height="1" fill="currentColor"/><rect x="9" y="11" width="1" height="1" fill="currentColor"/></svg>
    <p class="ring-heading" id="ringHeading">alarm!</p>
    <div class="ring-time" id="ringTime">16:30</div>
    <button class="go" id="ringDismiss" type="button">dismiss</button>
  </div>
</div>

<script src="../assets/config.js"></script>
<script src="../assets/motion.js"></script>
<script src="../assets/sync.js"></script>
<script src="../assets/store.js"></script>
<script src="../assets/calendar.js"></script>
<script src="../assets/ai-brain.js"></script>
<script src="../assets/ai.js"></script>
<script src="../assets/plan.js"></script>
<script src="../assets/settings.js"></script>

<script src="../assets/app.js"></script>

</body>
</html>
